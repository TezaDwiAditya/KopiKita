services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    image: kopikita-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-KopiKita}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-kopikita}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - kopikita_prod_storage:/var/www/html/storage
      - kopikita_prod_cache:/var/www/html/bootstrap/cache
      - kopikita_prod_public:/var/www/html/public
      - kopikita_prod_database_data:/var/www/html/database-data
    depends_on:
      - mysql
    networks:
      - kopikita_prod

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - kopikita_prod_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kopikita_prod

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kopikita}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - kopikita_prod_mysql:/var/lib/mysql
    networks:
      - kopikita_prod

networks:
  kopikita_prod:
    driver: bridge

volumes:
  kopikita_prod_storage:
  kopikita_prod_cache:
  kopikita_prod_public:
  kopikita_prod_database_data:
  kopikita_prod_mysql:
