services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: kopikita-app:dev
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-KopiKita}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-kopikita_dev}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      INSTALL_COMPOSER_DEPS: "true"
      RUN_MIGRATIONS: "true"
    volumes:
      - .:/var/www/html
      - kopikita_dev_vendor:/var/www/html/vendor
      - kopikita_dev_storage:/var/www/html/storage
      - kopikita_dev_cache:/var/www/html/bootstrap/cache
    networks:
      - kopikita_dev

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - kopikita_dev_storage:/var/www/html/storage:ro
      - kopikita_dev_cache:/var/www/html/bootstrap/cache:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kopikita_dev

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - kopikita_dev_node_modules:/var/www/html/node_modules
    networks:
      - kopikita_dev

networks:
  kopikita_dev:
    driver: bridge

volumes:
  kopikita_dev_vendor:
  kopikita_dev_node_modules:
  kopikita_dev_storage:
  kopikita_dev_cache:
