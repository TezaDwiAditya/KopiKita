services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kopikita-app:latest
    restart: unless-stopped
    environment:
      APP_NAME: KopiKita
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: kopikita_dev
      DB_USERNAME: root
      DB_PASSWORD: ""
    volumes:
      - kopikita_storage:/var/www/html/storage
      - kopikita_cache:/var/www/html/bootstrap/cache
      - kopikita_public:/var/www/html/public
    networks:
      - kopikita

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - kopikita_public:/var/www/html/public:ro
    networks:
      - kopikita

networks:
  kopikita:
    driver: bridge

volumes:
  kopikita_storage:
  kopikita_cache:
  kopikita_public:
