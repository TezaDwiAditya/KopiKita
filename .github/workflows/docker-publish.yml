name: Build, Push & Deploy KopiKita

on:
  push:
    branches:
      - main

concurrency:
  group: kopikita-production
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Production Apache Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            casatech/kopikita:latest
            casatech/kopikita:${{ github.sha }}

  deploy:
    name: Deploy to Production VPS
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy KopiKita
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/kopikita_deploy_key
          chmod 600 ~/.ssh/kopikita_deploy_key
          chmod 644 ~/.ssh/known_hosts

          ssh -i ~/.ssh/kopikita_deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /casatech/kopikita

          git pull --ff-only origin main

          sudo env APP_IMAGE_TAG="$IMAGE_TAG" docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml pull app

          sudo env APP_IMAGE_TAG="$IMAGE_TAG" docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml up -d app nginx

          sudo docker image prune -f

          sudo env APP_IMAGE_TAG="$IMAGE_TAG" docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml ps

          echo "Deployment completed: casatech/kopikita:$IMAGE_TAG"
          REMOTE
